<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kibry — Leaderboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1 class="logo"><span>K</span><span>i</span><span>b</span><span>r</span><span>y</span></h1>
    <p>Leaderboard — total score is earned by winning rounds with a partner, and never goes down.</p>
  </header>

  <main>

    <nav class="player-bar">
      <span class="nav-links">
        <a href="index.html">Play</a>
        <a href="shop.html">Shop</a>
      </span>
    </nav>

    <section>
      <h2>Top players</h2>

      <table id="leaderboard-table">
        <thead>
          <tr>
            <th scope="col">Rank</th>
            <th scope="col">Player</th>
            <th scope="col">Total score</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>

      <p id="leaderboard-message" class="message" role="status">Loading the leaderboard...</p>
    </section>

  </main>

  <script type="module" src="leaderboard.js" defer></script>

</body>

</html>
